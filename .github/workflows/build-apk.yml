name: Build & release device-control APKs

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradlew is committed (this sandbox had no network access to
      # generate the wrapper jar), so Gradle itself is installed here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing keystore
        run: |
          # Must land inside android/app/, not android/ - the next step's
          # SC_KEYSTORE_PATH is relative to the :app module's project dir
          # (build.gradle.kts resolves file(ksPath) against that), not the
          # repo root. Putting it one level up ("android/keystore/...")
          # made Gradle fail with "Keystore file ... not found" even
          # though the decode itself succeeded.
          mkdir -p android/app/keystore
          echo "${{ secrets.SC_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/sc-release.jks

      - name: Build + sign both flavors
        working-directory: android
        env:
          SC_KEYSTORE_PATH: keystore/sc-release.jks
          SC_KEYSTORE_PASSWORD: ${{ secrets.SC_KEYSTORE_PASSWORD }}
          SC_KEY_ALIAS: ${{ secrets.SC_KEY_ALIAS }}
          SC_KEY_PASSWORD: ${{ secrets.SC_KEY_PASSWORD }}
        run: |
          gradle :app:assembleShopRelease :app:assembleResellerRelease --no-daemon

      - name: Collect APKs under the exact names the web app downloads
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/shop/release/app-shop-release.apk dist/SC-Shop.apk
          cp android/app/build/outputs/apk/reseller/release/app-reseller-release.apk dist/SC-Reseller.apk
          ls -la dist

      # The web app's "Scan a QR" Device-Owner enrolment needs the signing
      # certificate's SHA-256 checksum, in the exact base64url/no-padding
      # form android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM
      # expects - NOT the colon-hex fingerprint keytool prints by default.
      # Written here so every release carries it; nothing to compute by hand.
      - name: Compute the app's signing-certificate checksum (for QR enrolment)
        env:
          SC_KEYSTORE_PASSWORD: ${{ secrets.SC_KEYSTORE_PASSWORD }}
          SC_KEY_ALIAS: ${{ secrets.SC_KEY_ALIAS }}
        run: |
          keytool -exportcert -alias "$SC_KEY_ALIAS" -keystore android/app/keystore/sc-release.jks -storepass "$SC_KEYSTORE_PASSWORD" -file dist/sc-release-cert.der
          CHECKSUM=$(openssl dgst -sha256 -binary dist/sc-release-cert.der | base64 | tr '+/' '-_' | tr -d '=\n')
          echo "Signing certificate SHA-256 (for QR enrolment): $CHECKSUM" | tee dist/CHECKSUMS.txt
          rm -f dist/sc-release-cert.der

      - name: Publish a release (this is what releases/latest/download/... resolves to)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Device apps build #${{ github.run_number }}"
          body_path: dist/CHECKSUMS.txt
          files: |
            dist/SC-Shop.apk
            dist/SC-Reseller.apk
            dist/CHECKSUMS.txt
          make_latest: true
